<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Malawi Geoportal</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="nav-container">

            <div class="logo">
                Malawi Geoportal
            </div>

            <div class="nav-links">

                <a href="../index.html">Home</a>

                <a href="datasets.html">Datasets</a>

                <a href="map.html">Interactive Map</a>

                <a href="about.html">About</a>

                <a href="login.html" class="active">
                    Login
                </a>

            </div>

        </div>

    </nav>


    <!-- Login Section -->
    <main class="login-page">

        <div class="login-container">

            <div class="login-header">

                <h1>Malawi Geoportal</h1>

                <p>
                    Sign in to access the Geoportal
                </p>

            </div>


            <!-- Login Form -->
            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="role">
                        Account Type
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="public">
                            Public User
                        </option>

                        <option value="department">
                            Department User
                        </option>

                        <option value="admin">
                            Administrator
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

    <div class="login-links">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

                <a href="create-account.html">
                    Create Account
                </a>

</div>


                <p
                    id="login-message"
                    class="login-message"
                ></p>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Malawi Geoportal
        </p>

        <p>
            Multi-Departmental Geospatial Information Sharing Platform
        </p>

    </footer>


    <!-- Login JavaScript -->
    <script src="../js/login.js"></script>

</body>

</html>
